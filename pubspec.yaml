name: akash_portfolio
description: "Personal portfolio website for Akash Zaib Malik - Flutter Mobile App Developer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Internationalization
  intl: ^0.20.2
  
  # URL Launching (for social links)
  url_launcher: ^6.2.5
  
  # Icons
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8
  
  # Typography
  google_fonts: ^6.2.1
  
  # HTTP for EmailJS
  http: ^1.2.1
  firebase_core: ^4.6.0
  firebase_analytics: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/
    - assets/images/
    - assets/images/lookbook/
    - assets/images/lookbook/images/
    - assets/images/isoar/
    - assets/images/expenseTracker/
    - assets/images/bienance/
    - assets/images/oosc/
    - assets/documents/
